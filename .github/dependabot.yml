version: 2
# The gomod updater must fetch the private github.com/rarebit-one/void-which-binds-go
# module over git; GO_PRIVATE_READ_PAT is a read-only PAT held as an org
# Dependabot secret.
registries:
  github-rarebit-one:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.GO_PRIVATE_READ_PAT}}
updates:
  - package-ecosystem: gomod
    directory: /
    registries:
      - github-rarebit-one
    schedule: { interval: weekly }
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/deploy/docker"]
    schedule: { interval: weekly }
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
