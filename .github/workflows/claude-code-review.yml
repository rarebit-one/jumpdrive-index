name: Claude Code Review

# Automatic PR review on every non-draft pull request, via the org-shared
# reusable. Defaults to ubuntu-latest (secrets: inherit supplies the org
# ANTHROPIC credential + CLAUDE_MODEL var).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: rarebit-one/.github/.github/workflows/claude-code-review.yml@main
    secrets: inherit
