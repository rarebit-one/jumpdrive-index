name: Pin Gate

# Thin caller for the org-shared Actions-pinning gate (zizmor + pinact +
# workflow validity) in rarebit-one/.github. The `auto-merge gate` ruleset
# requires the `pin-check / Actions pinning gate` context (set 2026-09-24), but
# this repo had no caller, so every PR was BLOCKED waiting on a check that could
# never arrive. Same caller as jumpdrive-runner/jumpdrive-broker.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pin-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pin-check:
    permissions:
      contents: read
    uses: rarebit-one/.github/.github/workflows/pin-check.yml@main
