name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Build-tagged files are invisible to a lint run on another platform, so
        # lint every OS the binary is built for.
        goos: [linux, darwin, windows]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with: { version: latest }
      # A malformed workflow file does not fail — it silently never runs.
      # actionlint catches that before it can hide a broken pipeline.
      - name: lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      # -race is non-negotiable: the store's single-writer/reader-pool split is a
      # concurrency claim, and the cross-adapter conformance suite runs under it.
      - run: go test -race -count=1 -coverprofile=coverage.out ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      # CGO_ENABLED=0 is load-bearing: the SQLite adapter is pure-Go
      # (modernc.org/sqlite) precisely so the binary stays static and the
      # distroless/scratch image works. A build that needs cgo is a regression.
      - env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./...

  acceptance:
    name: acceptance (make demo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      # The milestone gate: gofmt + vet + CGO-off build + the whole test suite
      # (incl. the cross-adapter conformance matrix) under one target.
      - run: make demo

  # Runs the SAME conformance matrix against a real Postgres, so the two storage
  # adapters cannot diverge. The `test`/`acceptance` jobs above run it against
  # SQLite (and the Postgres test self-skips there, JDX_TEST_DATABASE_URL unset).
  test-postgres:
    name: conformance (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jdx
          POSTGRES_PASSWORD: jdx
          POSTGRES_DB: jdx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jdx" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      JDX_TEST_DATABASE_URL: postgres://jdx:jdx@localhost:5432/jdx_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, cache: true }
      # A silently-skipped gate can pass as green: run the suite verbosely and
      # assert the core Postgres subtests actually ran, not skipped.
      - name: run + assert the Postgres conformance actually ran
        run: |
          go test -race -count=1 -v ./internal/store/postgres/ -run TestPostgresConformance | tee /tmp/pg.log
          if grep -qE -- '--- SKIP: TestPostgresConformance($|[^/])' /tmp/pg.log; then
            echo "Postgres conformance skipped — the DB URL did not take" >&2; exit 1
          fi
          for sub in insert_and_get external_collision_merges access_filter_hides_private rebuild_reproduces_projection; do
            grep -q -- "--- PASS: TestPostgresConformance/$sub" /tmp/pg.log || {
              echo "Postgres conformance subtest '$sub' did not run+pass" >&2; exit 1; }
          done

  # Aggregate status so branch protection needs exactly one required check.
  ci:
    name: ci
    if: always()
    needs: [lint, test, build, acceptance, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail if any job failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "one or more ci jobs failed"; exit 1
          fi
          echo "all ci jobs passed"
